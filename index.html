<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mithur - Cómic</title>
  <link rel="stylesheet" href="style.css">
  <!-- SDK de Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- Encabezado estilo Netflix -->
  <header>
    <h1>MITHUR</h1>
    <div id="user-profile" style="display:none;">
      <img id="avatar-img" src="" alt="Perfil" width="40" height="40" style="border-radius:50%;">
      <span id="user-name"></span>
    </div>
  </header>

  <!-- Formulario de Registro / Login -->
  <section id="auth-section">
    <h2>Entrar a Mithur</h2>
    <input type="text" id="nombre" placeholder="Nombre de usuario">
    <input type="password" id="password" placeholder="Contraseña">
    <label>Foto de perfil:</label>
    <input type="file" id="foto-input" accept="image/*">
    <button id="btn-login">Iniciar Sesión / Registrarse</button>
  </section>

  <!-- Visor del Cómic -->
  <main id="comic-section">
    <h2>Capítulo 1</h2>
    <div class="comic-viewer">
      <!-- Aquí pones las imágenes de las páginas de tu cómic -->
      <img src="paginas/pag1.jpg" alt="Página 1 de Mithur">
    </div>
  </main>

  <!-- Panel de Admin (Solo para ti) -->
  <section id="admin-panel" style="display:none; background: #222; padding: 20px; margin-top: 20px;">
    <h2>Panel de Creador (Admin)</h2>
    <p>¡Hola! Desde aquí puedes publicar nuevas páginas de Mithur.</p>
    <input type="file" id="nueva-pagina">
    <button>Subir Página</button>
  </section>

  <script src="script.js"></script>
</body>
</html>
