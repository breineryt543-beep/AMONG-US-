<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Crear cuenta · Misión Lunar</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card panel">
      <div class="auth-logo">MISIÓN<span> LUNAR</span></div>
      <div class="auth-tag">Crea tu cuenta de tripulante.</div>

      <div id="errorBox" class="error-msg"></div>

      <form id="registerForm">
        <div class="field">
          <label for="name">Nombre</label>
          <input type="text" id="name" placeholder="ej. Juan Pérez" autocomplete="name" />
        </div>
        <div class="field">
          <label for="username">Usuario</label>
          <input type="text" id="username" placeholder="ej. astro_juan" autocomplete="username" />
        </div>
        <button type="submit" class="btn" style="width:100%;">Crear cuenta</button>
      </form>

      <div class="auth-switch">¿Ya tienes cuenta? <a href="index.html">Inicia sesión</a></div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    if (getSession()) window.location.href = "home.html";

    const form = document.getElementById("registerForm");
    const errorBox = document.getElementById("errorBox");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      hideError(errorBox);
      const name = document.getElementById("name").value.trim();
      const username = document.getElementById("username").value.trim();
      if (!name || !username) return showError(errorBox, "Completa nombre y usuario.");
      try {
        const { user } = await api("/register", {
          method: "POST",
          body: JSON.stringify({ name, username }),
        });
        setSession(user);
        window.location.href = "home.html";
      } catch (err) {
        showError(errorBox, err.message);
      }
    });
  </script>
</body>
</html>
