<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Misión Lunar</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="overlay" id="navOverlay"></div>
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <img class="avatar session-avatar" src="" alt="avatar" />
      <div>
        <div class="name session-name"></div>
        <div class="user session-user"></div>
      </div>
    </div>
    <a class="nav-link" data-page="home" href="home.html"><span class="nav-icon">&#9679;</span> Home</a>
    <a class="nav-link" data-page="perfil" href="perfil.html"><span class="nav-icon">&#9737;</span> Perfil</a>
    <a class="nav-link" data-page="blog" href="blog.html"><span class="nav-icon">&#9998;</span> Blog</a>
    <a class="nav-link" data-page="amigos" href="amigos.html"><span class="nav-icon">&#9733;</span> Amigos</a>
    <div class="sidebar-footer">
      <button class="btn btn-ghost btn-small" id="logoutBtn" style="width:100%;">Salir</button>
    </div>
  </nav>

  <header class="topbar">
    <div class="topbar-left">
      <button class="hamburger" id="navToggle" aria-label="Abrir menú">
        <span></span><span></span>
      </button>
      <div class="topbar-logo">MISIÓN<span> LUNAR</span></div>
    </div>
    <div class="topbar-right">
      <img class="avatar session-avatar" src="" alt="avatar" />
    </div>
  </header>

  <main class="page">
    <section class="hero">
      <div class="hero-eyebrow">Cómic original</div>
      <h1 class="hero-title">MISIÓN<br /><span>LUNAR</span></h1>
      <p class="hero-desc">
        Una tripulación varada a mitad de camino a la Luna descubre que la nave
        no es lo único que despertó durante el viaje. Sigue la historia capítulo
        a capítulo.
      </p>
      <div class="hero-actions">
        <button class="btn" id="readBtn">▶ Leer capítulo 1</button>
        <a href="blog.html" class="btn btn-ghost">Ver blog</a>
      </div>
    </section>

    <h2 class="section-title">Capítulos <small>Temporada 1</small></h2>
    <div class="chapter-row" id="chapterRow"></div>
  </main>

  <script src="js/app.js"></script>
  <script>
    initShell("home");

    const chapters = [
      { n: 1, title: "Despegue", bg: "linear-gradient(160deg,#2b2140,#0d1220)" },
      { n: 2, title: "Silencio", bg: "linear-gradient(160deg,#142235,#0d1220)" },
      { n: 3, title: "Cráter 9", bg: "linear-gradient(160deg,#26313f,#0d1220)" },
      { n: 4, title: "Eco", bg: "linear-gradient(160deg,#20263c,#0d1220)" },
      { n: 5, title: "Regreso", bg: "linear-gradient(160deg,#301d24,#0d1220)" },
    ];

    const row = document.getElementById("chapterRow");
    chapters.forEach((c) => {
      const el = document.createElement("div");
      el.className = "chapter-card panel";
      el.innerHTML = `
        <div class="chapter-cover" style="background:${c.bg}">${c.title}</div>
        <div class="chapter-meta"><b>Capítulo ${c.n}</b>Próximamente</div>
      `;
      el.addEventListener("click", () => alert(`Capítulo ${c.n}: ${c.title} — próximamente disponible para leer.`));
      row.appendChild(el);
    });

    document.getElementById("readBtn").addEventListener("click", () => {
      alert("El lector de cómic todavía no está montado. ¡Aquí conectarás las páginas de tu capítulo 1!");
    });
  </script>
</body>
</html>
