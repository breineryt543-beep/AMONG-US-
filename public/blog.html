<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Blog · Misión Lunar</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="overlay" id="navOverlay"></div>
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="session-avatar-slot"></span>
      <div>
        <div class="name session-name"></div>
        <div class="user session-user"></div>
      </div>
    </div>
    <a class="nav-link" data-page="home" href="home.html"><span class="nav-icon">&#9679;</span> Home</a>
    <a class="nav-link" data-page="perfil" href="perfil.html"><span class="nav-icon">&#9737;</span> Perfil</a>
    <a class="nav-link" data-page="blog" href="blog.html"><span class="nav-icon">&#9998;</span> Blog</a>
    <a class="nav-link" data-page="amigos" href="amigos.html"><span class="nav-icon">&#9733;</span> Amigos</a>
    <div class="sidebar-footer">
      <button class="btn btn-ghost btn-small" id="logoutBtn" style="width:100%;">Salir</button>
    </div>
  </nav>

  <header class="topbar">
    <div class="topbar-left">
      <button class="hamburger" id="navToggle" aria-label="Abrir menú">
        <span></span><span></span>
      </button>
      <div class="topbar-logo">MISIÓN<span> LUNAR</span></div>
    </div>
    <div class="topbar-right">
      <span class="session-avatar-slot"></span>
    </div>
  </header>

  <main class="page">
    <h1 class="hero-title" style="font-size:38px; margin-bottom:20px;">Blog</h1>

    <div class="panel card-pad">
      <div id="errorBox" class="error-msg"></div>
      <form id="postForm">
        <div class="field">
          <textarea id="text" rows="3" placeholder="¿Qué está pasando en la misión?"></textarea>
        </div>
        <button type="submit" class="btn">Publicar</button>
      </form>
    </div>

    <div id="posts" style="margin-top:26px;"></div>
  </main>

  <script src="js/app.js"></script>
  <script>
    const user = initShell("blog");
    const errorBox = document.getElementById("errorBox");
    const postsEl = document.getElementById("posts");

    async function loadPosts() {
      postsEl.innerHTML = `<div class="empty-state">Cargando publicaciones...</div>`;
      try {
        const { posts } = await api("/blog");
        if (!posts.length) {
          postsEl.innerHTML = `<div class="empty-state">Todavía no hay publicaciones. ¡Sé el primero!</div>`;
          return;
        }
        postsEl.innerHTML = "";
        posts.forEach((p) => {
          const el = document.createElement("div");
          el.className = "panel post";
          el.innerHTML = `
            <div class="post-head">
              ${renderAvatarHTML(p, "sm")}
              <div>
                <b>${p.name}</b> <span>@${p.username} · ${timeAgo(p.createdAt)}</span>
              </div>
            </div>
            <div class="post-text"></div>
          `;
          el.querySelector(".post-text").textContent = p.text;
          postsEl.appendChild(el);
        });
      } catch (err) {
        postsEl.innerHTML = `<div class="empty-state">No se pudieron cargar las publicaciones.</div>`;
      }
    }

    document.getElementById("postForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      hideError(errorBox);
      const text = document.getElementById("text").value.trim();
      if (!text) return showError(errorBox, "Escribe algo antes de publicar.");
      try {
        await api("/blog", {
          method: "POST",
          body: JSON.stringify({ username: user.username, text }),
        });
        document.getElementById("text").value = "";
        loadPosts();
      } catch (err) {
        showError(errorBox, err.message);
      }
    });

    if (user) loadPosts();
  </script>
</body>
</html>
