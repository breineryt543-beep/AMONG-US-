<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Misión Lunar</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card panel">
      <div class="auth-logo">MISIÓN<span> LUNAR</span></div>
      <div class="auth-tag">Tu cómic, en órbita.</div>

      <div id="errorBox" class="error-msg"></div>

      <form id="loginForm">
        <div class="field">
          <label for="username">Usuario</label>
          <input type="text" id="username" placeholder="ej. astro_juan" autocomplete="username" />
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
        </div>
        <button type="submit" class="btn" style="width:100%;">Entrar</button>
      </form>

      <div class="auth-switch">¿No tienes cuenta? <a href="register.html">Regístrate</a></div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    // si ya hay sesión, ir directo a home
    if (getSession()) window.location.href = "home.html";

    const form = document.getElementById("loginForm");
    const errorBox = document.getElementById("errorBox");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      hideError(errorBox);
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      if (!username || !password) return showError(errorBox, "Escribe tu usuario y contraseña.");
      try {
        const { user } = await api("/login", {
          method: "POST",
          body: JSON.stringify({ username, password }),
        });
        setSession(user);
        window.location.href = "home.html";
      } catch (err) {
        showError(errorBox, err.message);
      }
    });
  </script>
</body>
</html>
